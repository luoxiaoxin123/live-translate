# Publish a GitHub Release + APK when you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Or create a Release on the GitHub website with tag v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fresh CI VMs regenerate a random debug keystore per run, which gives
      # every release a different signature and forces users to uninstall
      # before each update. Restore the stable keystore from secrets instead.
      # Secrets: SIGNING_KEYSTORE (base64 .keystore), SIGNING_KEYSTORE_PASSWORD,
      # SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::error::Secret SIGNING_KEYSTORE is not set. Add repo secrets: SIGNING_KEYSTORE (base64-encoded keystore), SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/live-translate.keystore"

      - name: Parse version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          # v0.1.0 -> 0.1.0
          VERSION_NAME="${TAG#v}"
          # Monotonic code for this repo (run number is fine for GitHub-only releases)
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which newer
          # runner cmdline-tools no longer offer (sdkmanager exits 1).
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PVERSION_NAME="${{ steps.ver.outputs.version_name }}" \
            -PVERSION_CODE="${{ steps.ver.outputs.version_code }}" \
            -PKEYSTORE_FILE="$RUNNER_TEMP/live-translate.keystore" \
            -PKEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PKEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          cp "$APK" "LiveTranslate-${{ steps.ver.outputs.version_name }}.apk"

      # Print the signing certificate so every release shows its identity in
      # the run log; compare against the SHA-256 documented in the README.
      - name: Verify signing certificate
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Live Translate ${{ steps.ver.outputs.version_name }}
          generate_release_notes: true
          files: |
            LiveTranslate-${{ steps.ver.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
