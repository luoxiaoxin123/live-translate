# Debug APK: every branch push, every PR, or Actions → CI → Run workflow.
# After a run finishes, download LiveTranslate-debug.apk from Artifacts.
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Also run unit tests
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stable signing across CI runs so debug artifacts can upgrade in place
      # (fresh VMs would otherwise regenerate a random debug keystore per run).
      # Fork PRs have no secrets access and fall back to the machine debug
      # keystore, which is fine for throwaway test builds.
      - name: Restore signing keystore
        id: keystore
        if: env.SIGNING_KEYSTORE != ''
        run: |
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/live-translate.keystore"
          echo "file=$RUNNER_TEMP/live-translate.keystore" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which newer
          # runner cmdline-tools no longer offer (sdkmanager exits 1).
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ -f "$RUNNER_TEMP/live-translate.keystore" ]; then
            SIGN_ARGS+=(
              -PKEYSTORE_FILE="$RUNNER_TEMP/live-translate.keystore"
              -PKEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD"
              -PKEY_ALIAS="$SIGNING_KEY_ALIAS"
              -PKEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            )
          fi
          ./gradlew :app:assembleDebug "${SIGN_ARGS[@]}" --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LiveTranslate-debug.apk
          ls -lh dist/LiveTranslate-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-debug
          path: dist/LiveTranslate-debug.apk
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Debug APK"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo
            echo "Open this run → **Artifacts** → **LiveTranslate-debug** to download \`LiveTranslate-debug.apk\`."
            echo
            echo "To run again: Actions → **CI** → **Run workflow** → pick this branch."
          } >> "$GITHUB_STEP_SUMMARY"
